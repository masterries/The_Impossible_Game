server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Prüfpunkt für HEALTHCHECK und Traefik.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vite hängt einen Hash an die Dateinamen, deshalb darf hier lange gecacht
    # werden. Bewusst nur add_header und kein expires, sonst stehen zwei
    # konkurrierende Cache-Control-Header in derselben Antwort.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        try_files $uri =404;
    }

    # Einzelseite ohne Client-Routing: unbekannte Pfade sind echte 404 und
    # bekommen keinen index.html-Fallback.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy no-referrer always;
        try_files $uri $uri/ =404;
    }
}
